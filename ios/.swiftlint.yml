# SwiftLint config — lint gate for the iOS app.
included:
  - BlackjackTrainer
  - BlackjackTrainerTests

excluded:
  - BlackjackTrainer.xcodeproj
  - Fixtures
  - build

disabled_rules:
  - todo
  # SwiftUI builder-style views (action closure + trailing @ViewBuilder content,
  # e.g. FeedbackShellView(onNext:){ content }) idiomatically mix an inline and a
  # trailing closure, exactly as Apple's Button(action:label:) does.
  - multiple_closures_with_trailing_closure

# The engines use short, math-y identifiers (card values a/b, rank r, etc.),
# mirroring the TypeScript source. Allow them while keeping the rest of the rule.
identifier_name:
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 120
  error: 160
  ignores_comments: true

# Same principle as line_length's ignores_comments: the budget is on how much
# code one file holds, not on how well it is explained. These files run ~25%
# doc comment by design (the why, and what the web original does), and counting
# that against the cap has already cost real encapsulation once — CountingModel
# was split at 301 lines of code, which forced its stores to drop `private`.
file_length:
  warning: 400
  error: 1000
  ignore_comment_only_lines: true
