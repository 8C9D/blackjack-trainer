<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blackjack Trainer</title>
    <base href="/" />

    <!-- Mobile viewport: device-width + viewport-fit=cover so the layout can use
       env(safe-area-inset-*) under notches / the iOS home indicator. Zoom is
       intentionally left enabled for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Practice blackjack basic strategy, Hi-Lo card counting, true count, and deviations. Frontend-only trainer with per-session stats."
    />
    <meta name="color-scheme" content="dark light" />

    <!-- Browser/OS chrome theming + PWA-ready basics. The dark ground is the
       pre-boot default (it is what :root declares); ThemeService rewrites this
       to the resolved theme's ground as soon as the app starts. -->
    <meta name="theme-color" content="#15171c" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS standalone ("Add to Home Screen") hints. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blackjack Trainer" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
    <!-- The app is the whole page, so without JavaScript there is nothing here
       at all. This is the only copy that can say so; the palette falls back to
       the pre-boot ground and ink if the stylesheet is missing too. -->
    <noscript>
      <div
        style="
          box-sizing: border-box;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 0.75rem;
          max-width: 32rem;
          margin: 0 auto;
          padding: 2rem 1.25rem;
          background: var(--ground, #15171c);
          color: var(--ink, #e7e9ee);
          font-family:
            system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
        "
      >
        <h1 style="margin: 0; font-size: 1.15rem; font-weight: 650">JavaScript is required</h1>
        <p style="margin: 0; font-size: 0.9rem; line-height: 1.5; color: var(--ink-2, #c6cad3)">
          Blackjack Trainer runs entirely in your browser, with no server behind it. Enable
          JavaScript for this page and reload to use it.
        </p>
      </div>
    </noscript>
  </body>
</html>
