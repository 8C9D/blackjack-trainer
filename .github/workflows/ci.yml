name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push supersedes the in-flight run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: CI=true npm run test:coverage
      - run: npm run build
      - name: Verify parity fixtures are up to date (anti-drift gate)
        run: |
          npm run export:fixtures
          git diff --exit-code -- ios/Fixtures
      # The table the charts are held to: regenerated from the rules of the game,
      # so a solver change cannot leave a stale table behind it.
      - name: Verify the EV table is up to date (anti-drift gate)
        run: |
          npm run export:ev
          git diff --exit-code -- src/app/data/ev-table.generated.ts

  # The deployed bundle is built with a sub-path base href (pages.yml); this
  # job checks that bundle is relocatable, since an installed PWA with an
  # absolute manifest URL would launch at the shared Pages origin root.
  pages-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base-href /blackjack-trainer/
      - name: The deployed bundle must be relocatable under a sub-path
        run: |
          set -e
          d=dist/blackjack-trainer/browser
          grep -Eq '<base href="/blackjack-trainer/" ?/?>' "$d/index.html"
          # Every manifest URL must be relative, or an installed copy launches at
          # the origin root — which is a different project on this shared host.
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            for (const [k, v] of [["id", m.id], ["start_url", m.start_url], ["scope", m.scope]])
              if (!String(v).startsWith("./")) { console.error(k + " is " + v); process.exit(1); }
            for (const i of m.icons)
              if (String(i.src).startsWith("/")) { console.error("icon " + i.src); process.exit(1); }
          ' "$d/manifest.webmanifest"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version for the browser cache key
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Skips the browser download on a cache hit; always installs OS deps.
      - run: npx playwright install --with-deps chromium
      - name: Build the production bundle for the E2E server
        run: npm run build
      - run: npm run e2e
        env:
          E2E_SERVER: dist
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
